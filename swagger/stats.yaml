paths:
  /api/upload-stats:
    post:
      tags:
        - Stats
      summary: Sube ZIP de Letterboxd y devuelve estadísticas
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Estadísticas calculadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMovies:
                    type: integer
                    example: 232
                  averageRating:
                    type: number
                    format: float
                    example: 3.94
                  ratingDistribution:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      "1": 2
                      "2.5": 5
                      "3": 15
                      "4": 80
                      "5": 130
                  topYears:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: string
                          example: "2025"
                        count:
                          type: integer
                          example: 33
                  topTags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                          example: "netflix"
                        count:
                          type: integer
                          example: 40
                  rewatchStats:
                    type: object
                    properties:
                      totalRewatches:
                        type: integer
                      rewatchPercentage:
                        type: number
                      averageRatingFirstWatch:
                        type: number
                        nullable: true
                      averageRatingRewatch:
                        type: number
                        nullable: true
                  rewatchByYear:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: string
                          example: "2025"
                        totalWatches:
                          type: integer
                          example: 70
                        firstWatches:
                          type: integer
                          example: 62
                        rewatches:
                          type: integer
                          example: 8
                        firstWatchPercentage:
                          type: number
                          example: 88.6
                        rewatchPercentage:
                          type: number
                          example: 11.4
                  reviewTextStats:
                    type: object
                    properties:
                      totalWordsWritten:
                        type: integer
                      longestReview:
                        type: object
                        nullable: true
                  ratingExtremes:
                    type: object
                    properties:
                      highest:
                        type: array
                        items:
                          type: object
                      lowest:
                        type: array
                        items:
                          type: object
                  runtimeExtremes:
                    type: object
                    nullable: true
                    properties:
                      longest:
                        type: object
                      shortest:
                        type: object
                  watchSpan:
                    type: object
                    nullable: true
                    properties:
                      first:
                        type: object
                      last:
                        type: object
                  franchiseStats:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  studioStats:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  industryTotals:
                    type: object
                    properties:
                      totalBudget:
                        type: integer
                      totalRevenue:
                        type: integer
                  ratingComparison:
                    type: object
                    nullable: true
                    properties:
                      yourAverage:
                        type: number
                      worldAverage:
                        type: number
                      sampleSize:
                        type: integer
                  favoriteFilms:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        posterPath:
                          type: string
                          nullable: true
                  customLists:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        filmCount:
                          type: integer
                  daysActive:
                    type: integer
                    nullable: true
        "400":
          description: Error de validación
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Archivo requerido en el campo 'file'."
        "413":
          description: Archivo demasiado grande
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "El archivo supera el límite de 20MB."
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error interno del servidor."
